name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller ezdxf openpyxl
      - run: pyinstaller --onefile --windowed --name "HotelCADAnalyzer" simple_analyzer.py
      - uses: actions/upload-artifact@v4
        with:
          name: HotelCADAnalyzer
          path: dist/*.exe
